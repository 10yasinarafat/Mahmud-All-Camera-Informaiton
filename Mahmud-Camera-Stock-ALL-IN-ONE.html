<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahmud Camera Stock</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d13;color:#edf3fa;font:14px Segoe UI,Arial}aside{position:fixed;width:245px;top:0;bottom:0;background:#0d131c;border-right:1px solid #243041;padding:22px 15px}.brand{display:flex;gap:10px;align-items:center;font-size:15px}.brand>b{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#39a0ff,#8968ef)}.brand small{display:block;color:#718097;font-size:9px;letter-spacing:2px;margin-top:3px}.loc{margin:18px 3px;padding:9px;border:1px solid #253142;border-radius:9px;color:#738196;font-size:10px;letter-spacing:1.5px}nav{display:grid;gap:6px}nav button{background:transparent;border:1px solid transparent;color:#9eabbc;padding:11px;border-radius:9px;text-align:left;cursor:pointer}nav button.active,nav button:hover{background:#162437;border-color:#29445f;color:white}main{margin-left:245px;padding:27px 32px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}header small{color:#4da4ff;letter-spacing:2px}h1{margin:5px 0;font-size:27px}.card{background:#101722;border:1px solid #263344;border-radius:14px;padding:18px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.kpi{min-height:130px}.kpi b{display:block;font-size:25px;margin:14px 0 7px}.blue{border-top:3px solid #4ea1ff}.green{border-top:3px solid #39d49a}.gold{border-top:3px solid #e7b95d}.purple{border-top:3px solid #a68afa}.muted{color:#8190a3;font-size:12px}.btn,header button{border:0;background:linear-gradient(135deg,#428fe8,#6e63e7);color:#fff;padding:10px 15px;border-radius:9px;font-weight:700;cursor:pointer}.section{margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.head h2{margin:0;font-size:15px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{color:#718096;font-size:10px;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid #263344}.table td{padding:11px 10px;border-bottom:1px solid #1d2733;white-space:nowrap}.positive{color:#45d6a1}.negative{color:#ff7180}.badge{padding:5px 8px;border-radius:99px;background:#18304a;color:#7ebaff;font-size:10px}.toolbar{display:flex;justify-content:space-between;margin-bottom:14px}.search,.input,.select{background:#0b1119;border:1px solid #293648;color:#fff;border-radius:9px;padding:10px;width:100%;outline:0}.search{width:320px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#8997aa}.actions{text-align:right;margin-top:17px}.notice{padding:11px;background:#111f2d;border:1px solid #29435f;border-radius:9px;color:#9eb4cc;margin-top:12px}.modal{width:min(760px,95vw);max-height:90vh;overflow:auto;background:#101722;border:1px solid #334258;border-radius:15px;padding:24px;position:relative}.modal>button{position:absolute;right:12px;top:8px;background:none;border:0;color:#8290a2;font-size:25px}.hide{display:none}#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:5}#modal.hide{display:none!important}.invoice{background:#f7f9fc;color:#17202d;padding:25px;border-radius:10px}.invoice .table{color:#17202d}.invoice .table th{color:#657388}.total{text-align:right;font-size:25px;font-weight:900;margin:18px 0}#toast{position:fixed;right:25px;bottom:25px;background:#172436;padding:12px 16px;border:1px solid #34506e;border-radius:9px;opacity:0;transition:.2s}#toast.show{opacity:1}@media(max-width:900px){aside{width:205px}main{margin-left:205px}.kpis{grid-template-columns:1fr 1fr}}@media(max-width:650px){aside{position:static;width:auto}main{margin:0;padding:18px}.kpis,.two,.form{grid-template-columns:1fr}}
</style></head><body>
<aside><div class="brand"><b>MC</b><span>Mahmud Camera<small>STOCK & SALES</small></span></div><div class="loc">MOSCOW · RUSSIA</div><nav>
<button data-p="dashboard">Dashboard</button><button data-p="sales">Product Sales</button><button data-p="stock">Stock</button><button data-p="profit">Profit History</button><button data-p="products">Products</button><button data-p="returns">Returns</button><button data-p="clients">Clients</button><button data-p="expenses">Expenses</button></nav></aside>
<main><header><div><small>CAMERA · PHOTO · VIDEO</small><h1 id="title">Dashboard</h1></div><button id="quick">+ New Sale</button></header><section id="view"></section></main>
<div id="modal" class="hide"><div class="modal"><button id="x">×</button><div id="mb"></div></div></div><div id="toast"></div><script>
const K='mcs_final_v1', $=s=>document.querySelector(s), today=()=>new Date().toISOString().slice(0,10), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(+n||0), df=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—', uid=()=>Date.now()+'-'+Math.random().toString(16).slice(2), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db=JSON.parse(localStorage.getItem(K)||'null')||{products:[],stock:[],sales:[],returns:[],clients:[],expenses:[]},page='dashboard';
const sum=(a,f)=>a.reduce((n,x)=>n+(+f(x)||0),0), prod=sku=>db.products.find(x=>x.sku===sku), rows=()=>{let m={};db.stock.forEach(x=>{m[x.sku]??={sku:x.sku,name:x.name,qty:0,value:0,buy:x.buy};m[x.sku].qty+=+x.qty;m[x.sku].value+=(+x.qty)*(+x.buy)});return Object.values(m)},qty=sku=>sum(db.stock.filter(x=>x.sku===sku),x=>x.qty);
function table(h,r){return `<div class=tablewrap><table class=table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.length?r.join(''):`<tr><td colspan=${h.length} style=text-align:center>No records found.</td></tr>`}</tbody></table></div>`}
function dash(){let s=rows(),q=sum(s,x=>x.qty),v=sum(s,x=>x.value),due=sum(db.sales,x=>x.due),p=sum(db.sales,x=>x.profit)-sum(db.returns,x=>x.loss)-sum(db.expenses,x=>x.amount),m=today().slice(0,7),mp=sum(db.sales.filter(x=>x.date.startsWith(m)),x=>x.profit)-sum(db.returns.filter(x=>x.date.startsWith(m)),x=>x.loss)-sum(db.expenses.filter(x=>x.date.startsWith(m)),x=>x.amount),dp=sum(db.sales.filter(x=>x.date===today()),x=>x.profit)-sum(db.returns.filter(x=>x.date===today()),x=>x.loss)-sum(db.expenses.filter(x=>x.date===today()),x=>x.amount);return `<div class="grid kpis"><div class="card kpi blue">CLIENT DUE<b>${money(due)}</b><span class=muted>Outstanding payments</span></div><div class="card kpi purple">TOTAL STOCK<b>${q} pcs</b><span class=muted>${money(v)} stock value</span></div><div class="card kpi green">TOTAL PROFIT<b>${money(p)}</b><span class=muted>Net after returns</span></div><div class="card kpi gold">MONTH PROFIT<b>${money(mp)}</b><span class=muted>Today: ${money(dp)}</span></div></div><div class=grid two style=margin-top:14px><div class=card><div class=head><h2>Profit</h2><span class=muted>Day & monthly</span></div><div class=notice>Today <b>${money(dp)}</b><br>Current month <b>${money(mp)}</b><br>All time <b>${money(p)}</b></div></div><div class=card><div class=head><h2>Stock Snapshot</h2></div>${table(['SKU','Product','PCS','Value'],s.slice(0,8).map(x=>`<tr><td><b>${esc(x.sku)}</b></td><td>${esc(x.name)}</td><td><b>${x.qty}</b></td><td>${money(x.value)}</td></tr>`))}</div></div>`}
function sales(){return `<div class=card><div class=head><h2>Product Sales</h2><span class=muted>Ozon · Yandex · Avito · Cash Client</span></div><form id=sale><div class=form>${[['date','Sale Date','date',today()],['order','Order Number','text','ORD-'+Date.now().toString().slice(-7)],['sku','SKU Number','text',''],['serial','Serial Number','text',''],['name','Product Name','text',''],['qty','Quantity','number','1'],['sell','Selling Price (RUB)','number','0'],['paid','Paid (RUB)','number','0']].map(a=>`<div class=field><label>${a[1]}</label><input class=input name=${a[0]} type=${a[2]} value="${a[3]}" required></div>`).join('')}</div><div class=field style=margin-top:13px><label>Sales Channel</label><select class=select name=channel><option>Ozon</option><option>Yandex</option><option>Avito</option><option>Cash Client</option></select></div><div id=si class=notice>Enter SKU to see available stock and buying price.</div><div class=actions><button class=btn>Complete Sale & Invoice</button></div></form></div><div class="card section">${table(['Date','Order','Channel','SKU','Serial','Selling','Profit'],db.sales.slice().reverse().map(x=>`<tr><td>${df(x.date)}</td><td>${esc(x.order)}</td><td><span class=badge>${esc(x.channel)}</span></td><td>${esc(x.sku)}</td><td>${esc(x.serial)}</td><td>${money(x.total)}</td><td class=positive>${money(x.profit)}</td></tr>`))}</div>`}
function stock(){return `<div class=toolbar><input id=ss class=search placeholder="Search SKU, product or serial..."><button id=addStock class=btn>+ Add Stock</button></div><div class=card>${table(['SKU','Product','PCS','Serial Numbers','Buying','Selling','Stock Value'],rows().map(x=>{let z=db.stock.filter(b=>b.sku===x.sku),ser=z.flatMap(b=>b.serials||[]);return `<tr><td><b>${esc(x.sku)}</b></td><td>${esc(x.name)}</td><td><b>${x.qty} pcs</b></td><td>${ser.map(a=>`<span class=badge>${esc(a)}</span>`).join(' ')||'—'}</td><td>${money(x.buy)}</td><td>${money(prod(x.sku)?.sell||0)}</td><td>${money(x.value)}</td></tr>`}))}</div>`}
function profit(){let d={};db.sales.forEach(x=>{d[x.date]??={sales:0,p:0};d[x.date].sales+=x.total;d[x.date].p+=x.profit});db.returns.forEach(x=>{if(d[x.date])d[x.date].p-=x.loss});return `<div class=card>${table(['Date','Sales','Orders','Net Profit'],Object.entries(d).sort().reverse().map(([k,v])=>`<tr><td>${df(k)}</td><td>${money(v.sales)}</td><td>${db.sales.filter(x=>x.date===k).length}</td><td class=positive>${money(v.p)}</td></tr>`))}</div>`}
function products(){return `<div class=toolbar><button id=ap class=btn>+ Add Product</button></div><div class=card>${table(['SKU','Product','Category','Selling Price'],db.products.map(x=>`<tr><td><b>${esc(x.sku)}</b></td><td>${esc(x.name)}</td><td>${esc(x.cat||'Camera')}</td><td>${money(x.sell)}</td></tr>`))}</div>`}
function returns(){return `<div class=card><div class=head><h2>Returns</h2><span class=muted>SKU search shows original sale date</span></div><form id=ret><div class=form><div class=field><label>SKU</label><input class=input name=sku required></div><div class=field><label>Quantity</label><input class=input name=qty type=number value=1 required></div><div class=field><label>Return Date</label><input class=input name=date type=date value=${today()} required></div></div><select id=ro class=select style=margin-top:13px name=order><option>Select SKU first</option></select><div id=ri class=notice>Enter SKU.</div><div class=actions><button class=btn>Process Return</button></div></form></div><div class=card section>${table(['Return Date','SKU','Order','Original Sale','Qty','Profit Minus'],db.returns.slice().reverse().map(x=>`<tr><td>${df(x.date)}</td><td>${esc(x.sku)}</td><td>${esc(x.order)}</td><td>${df(x.saleDate)}</td><td>${x.qty}</td><td class=negative>-${money(x.loss)}</td></tr>`))}</div>`}
function clients(){return `<div class=toolbar><button id=ac class=btn>+ Add Client</button></div><div class=card>${table(['Client','Phone','Orders','Due'],db.clients.map(c=>{let s=db.sales.filter(x=>x.client===c.name);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${s.length}</td><td>${money(sum(s,x=>x.due))}</td></tr>`}))}</div>`}
function expenses(){return `<div class=toolbar><button id=ae class=btn>+ Add Expense</button></div><div class=card>${table(['Date','Category','Description','Amount'],db.expenses.slice().reverse().map(x=>`<tr><td>${df(x.date)}</td><td>${esc(x.cat)}</td><td>${esc(x.desc)}</td><td>${money(x.amount)}</td></tr>`))}</div>`}
const V={dashboard:dash,sales,stock,profit,products,returns,clients,expenses};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));$('#title').textContent=page==='sales'?'Product Sales':page[0].toUpperCase()+page.slice(1);$('#view').innerHTML=V[page]();bind()}
function pop(title,body,fn){$('#mb').innerHTML=`<h2>${title}</h2><form id=mf>${body}<div class=actions><button class=btn>Save</button></div></form>`;$('#modal').classList.remove('hide');$('#mf').onsubmit=e=>{e.preventDefault();fn(new FormData(e.target));save();close();render();toast('Saved')}}
function close(){$('#modal').classList.add('hide')}function save(){localStorage.setItem(K,JSON.stringify(db))}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
function bind(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});$('#quick').onclick=()=>{page='sales';render()};$('#x').onclick=close;
$('#addStock')?.addEventListener('click',()=>pop('Add Stock',`<div class=form>${[['date','Stock Date','date',today()],['sku','SKU Number','text',''],['name','Product Name','text',''],['serials','Serial Numbers (one per line)','textarea',''],['buy','Buying Price (RUB)','number','0'],['sell','Selling Price (RUB)','number','0'],['qty','Quantity','number','1']].map(a=>`<div class=field><label>${a[1]}</label>${a[2]==='textarea'?`<textarea class=input name=${a[0]}>${a[3]}</textarea>`:`<input class=input name=${a[0]} type=${a[2]} value="${a[3]}" required>`}</div>`).join('')}</div>`,f=>{let p=prod(f.get('sku').trim());if(!p){p={sku:f.get('sku').trim(),name:f.get('name'),cat:'Camera',sell:+f.get('sell')};db.products.push(p)}db.stock.push({date:f.get('date'),sku:p.sku,name:p.name,buy:+f.get('buy'),sell:+f.get('sell'),qty:+f.get('qty'),serials:f.get('serials').split(/[\n,]+/).map(x=>x.trim()).filter(Boolean)})}));
$('#ap')?.addEventListener('click',()=>pop('Add Product',`<div class=form>${[['sku','SKU Number','text',''],['name','Product Name','text',''],['cat','Category','text','Camera'],['sell','Selling Price (RUB)','number','0']].map(a=>`<div class=field><label>${a[1]}</label><input class=input name=${a[0]} type=${a[2]} value="${a[3]}" required></div>`).join('')}</div>`,f=>db.products.push({sku:f.get('sku').trim(),name:f.get('name'),cat:f.get('cat'),sell:+f.get('sell')})));
$('#ac')?.addEventListener('click',()=>pop('Add Client',`<div class=form><div class=field><label>Name</label><input class=input name=name required></div><div class=field><label>Phone</label><input class=input name=phone></div></div>`,f=>db.clients.push({name:f.get('name'),phone:f.get('phone')})));
$('#ae')?.addEventListener('click',()=>pop('Add Expense',`<div class=form><div class=field><label>Date</label><input class=input name=date type=date value=${today()}></div><div class=field><label>Category</label><input class=input name=cat></div><div class=field><label>Description</label><input class=input name=desc></div><div class=field><label>Amount</label><input class=input name=amount type=number></div></div>`,f=>db.expenses.push({date:f.get('date'),cat:f.get('cat'),desc:f.get('desc'),amount:+f.get('amount')})));
$('#sale')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),sku=f.get('sku').trim(),q=+f.get('qty'),p=prod(sku);if(!p||qty(sku)<q)return alert('SKU not found or insufficient stock.');let need=q,cost=0;for(let b of db.stock.filter(x=>x.sku===sku)){if(!need)break;let take=Math.min(need,b.qty);cost+=take*b.buy;b.qty-=take;need-=take}let total=q*+f.get('sell'),s={date:f.get('date'),order:f.get('order'),sku,serial:f.get('serial'),client:f.get('client')||'Cash Client',qty:q,channel:f.get('channel'),total,paid:+f.get('paid'),due:Math.max(0,total-+f.get('paid')),cost,profit:total-cost};db.sales.push(s);save();render();invoice(s)});
$('#sale input[name=sku]')?.addEventListener('input',e=>{let p=prod(e.target.value.trim());if(p){$('#si').innerHTML=`Available: <b>${qty(p.sku)} pcs</b> · Default selling price: <b>${money(p.sell)}</b>`;if(!$('#sale input[name=sell]').value)$('#sale input[name=sell]').value=p.sell}});
$('#ret input[name=sku]')?.addEventListener('input',()=>{let sku=$('#ret input[name=sku]').value.trim(),a=db.sales.filter(x=>x.sku===sku);$('#ro').innerHTML=a.length?a.map(x=>`<option value="${x.order}">${esc(x.order)} · sold ${df(x.date)}</option>`).join(''):'<option value="">No sale found</option>';$('#ri').innerHTML=a.length?`Original sale date: <b>${df(a[0].date)}</b>`:'No matching sale.'});
$('#ret')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),s=db.sales.find(x=>x.order===f.get('order')),q=+f.get('qty');if(!s)return alert('Select original sale.');if(q>s.qty)return alert('Return quantity is too high.');db.stock.push({date:f.get('date'),sku:s.sku,name:prod(s.sku)?.name||s.sku,buy:s.cost/s.qty,sell:s.total/s.qty,qty:q,serials:[]});db.returns.push({date:f.get('date'),sku:s.sku,order:s.order,saleDate:s.date,qty:q,loss:(s.profit/s.qty)*q});save();render();toast('Return recorded and profit reduced')})}
function invoice(s){$('#mb').innerHTML=`<div class=invoice><h2>Mahmud Camera Stock</h2><small>Moscow, Russia · Camera / Photo / Video</small><hr>${table(['SKU','Serial','Qty','Channel','Total'],[`<tr><td>${esc(s.sku)}</td><td>${esc(s.serial)}</td><td>${s.qty}</td><td>${esc(s.channel)}</td><td>${money(s.total)}</td></tr>`])}<div class=total>${money(s.total)}</div><p>Order: ${esc(s.order)} · Date: ${df(s.date)} · Due: ${money(s.due)}</p><button class=btn onclick=window.print()>Print Invoice</button></div>`;$('#modal').classList.remove('hide')}
render();
</script></body></html>
